name: Commit Composer Audit Lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/composer-lock-third-pass.yml'

permissions:
  contents: write

jobs:
  commit-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Generate, verify and commit canonical lock
        shell: bash
        run: |
          set -euo pipefail
          composer update --working-dir=.audit/tools --no-interaction --no-progress --prefer-dist --no-plugins --no-scripts --no-install
          actual_lock_sha="$(sha256sum .audit/tools/composer.lock | awk '{print $1}')"
          expected_lock_sha='f5f0768d29b41a4c5833bd74031d1409268ee28efb42259bb5202668ae6f57c8'
          [[ "$actual_lock_sha" == "$expected_lock_sha" ]] || { echo "Generated lock differs from proven audit graph" >&2; exit 2; }
          git add .audit/tools/composer.lock
          git diff --cached --quiet && { echo 'No lock change to commit'; exit 0; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Commit canonical audit Composer lock'
          git push origin HEAD:main
