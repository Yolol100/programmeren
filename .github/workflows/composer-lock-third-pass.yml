name: Export Third-Pass Workflow Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/composer-lock-third-pass.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build validated patch files
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          full = Path('.github/workflows/full-plugin-audit.yml')
          text = full.read_text(encoding='utf-8')
          old = """          composer install --working-dir=.audit/tools --no-interaction --no-progress --prefer-dist --no-plugins --no-scripts
          expected_lock_sha='f5f0768d29b41a4c5833bd74031d1409268ee28efb42259bb5202668ae6f57c8'
          actual_lock_sha=\"$(sha256sum .audit/tools/composer.lock | awk '{print $1}')\"
          if [[ \"$actual_lock_sha\" != \"$expected_lock_sha\" ]]; then
            echo \"Audit dependency graph drift: expected $expected_lock_sha, got $actual_lock_sha\" >&2
            exit 2
          fi
"""
          new = """          composer validate --working-dir=.audit/tools --no-check-publish
          composer install --working-dir=.audit/tools --no-interaction --no-progress --prefer-dist --no-plugins --no-scripts
"""
          if old not in text:
              raise SystemExit('full audit dependency block did not match expected baseline')
          text = text.replace(old, new, 1)
          old = """          mkdir -p audit-results
          cp .audit/tools/composer.lock audit-results/audit-tools-composer.lock
"""
          new = """          mkdir -p audit-results
          sha256sum .audit/tools/composer.lock > audit-results/audit-tools-composer.lock.sha256
          cp .audit/tools/composer.lock audit-results/audit-tools-composer.lock
"""
          if old not in text:
              raise SystemExit('full audit evidence block did not match expected baseline')
          full.write_text(text.replace(old, new, 1), encoding='utf-8')

          toolkit = Path('.github/workflows/toolkit-contract.yml')
          text = toolkit.read_text(encoding='utf-8')
          old = """  validate:
    runs-on: ubuntu-latest
"""
          new = """  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
"""
          if old not in text:
              raise SystemExit('toolkit runner block did not match expected baseline')
          text = text.replace(old, new, 1)
          anchor = """          assert 'semgrep-version.txt' in installer, 'installer must record Semgrep version evidence'
          assert 'semgrep-python-deps.txt' in installer, 'installer must record resolved Semgrep dependency graph'
"""
          addition = anchor + """
          lock=pathlib.Path('.audit/tools/composer.lock')
          assert lock.is_file(), 'audit tooling must commit composer.lock'
          full_audit=pathlib.Path('.github/workflows/full-plugin-audit.yml').read_text(encoding='utf-8')
          assert 'composer validate --working-dir=.audit/tools --no-check-publish' in full_audit
          assert 'audit-tools-composer.lock.sha256' in full_audit
          assert 'expected_lock_sha' not in full_audit
          for workflow_path in pathlib.Path('.github/workflows').glob('*.yml'):
              workflow_text=workflow_path.read_text(encoding='utf-8')
              assert 'runs-on: ubuntu-latest' not in workflow_text, f'rolling runner alias in {workflow_path}'
"""
          if anchor not in text:
              raise SystemExit('toolkit assertion anchor did not match expected baseline')
          toolkit.write_text(text.replace(anchor, addition, 1), encoding='utf-8')
          PY
          git diff --check
          mkdir -p /tmp/third-pass-patch
          cp .github/workflows/full-plugin-audit.yml /tmp/third-pass-patch/full-plugin-audit.yml
          cp .github/workflows/toolkit-contract.yml /tmp/third-pass-patch/toolkit-contract.yml
      - name: Upload validated patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-pass-workflow-patch
          path: /tmp/third-pass-patch
          if-no-files-found: error
          retention-days: 1
