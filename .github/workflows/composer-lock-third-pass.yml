name: Generate Composer Audit Lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/composer-lock-third-pass.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Generate and verify lock
        shell: bash
        run: |
          set -euo pipefail
          composer update --working-dir=.audit/tools --no-interaction --no-progress --prefer-dist --no-plugins --no-scripts --no-install
          actual_lock_sha="$(sha256sum .audit/tools/composer.lock | awk '{print $1}')"
          expected_lock_sha='f5f0768d29b41a4c5833bd74031d1409268ee28efb42259bb5202668ae6f57c8'
          echo "generated_lock_sha=$actual_lock_sha"
          [[ "$actual_lock_sha" == "$expected_lock_sha" ]] || { echo "Generated lock differs from proven audit graph" >&2; exit 2; }
      - name: Upload canonical lock candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: composer-lock-third-pass
          path: .audit/tools/composer.lock
          if-no-files-found: error
          retention-days: 1
