name: WordPress theme and plugin release-pair QA

on:
  workflow_call:
    inputs:
      evidence_id:
        description: 'Unique safe label for this invocation within the caller workflow run'
        required: true
        type: string
      release_artifact:
        description: 'Artifact uploaded by the caller in the same private workflow run'
        required: true
        type: string
      theme_archive:
        description: 'Theme ZIP basename'
        required: true
        type: string
      plugin_archive:
        description: 'Candidate plugin ZIP basename'
        required: true
        type: string
      previous_plugin_archive:
        description: 'Optional prior plugin ZIP for an upgrade test'
        required: false
        default: ''
        type: string
      php_version:
        description: 'Isolated PHP version'
        required: false
        default: '8.3'
        type: string
      plugin_check:
        description: 'Run official WordPress Plugin Check'
        required: false
        default: true
        type: boolean
      lighthouse_lab:
        description: 'Optional Lighthouse on default WP page (not production speed)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release-pair:
    name: Isolated WordPress/MySQL release pair
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WP_ENV_HOME: /tmp/wp-release-pair-${{ github.run_id }}
      WP_ENV_PORT: '8890'
    steps:
      - name: Checkout trusted generic audit harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The reusable workflow's resolved commit, not the caller's changing branch.
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: harness
          persist-credentials: false
      - name: Download caller artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ inputs.release_artifact }}
          path: release-input
      - name: Validate archives without executing submitted source
        shell: bash
        env:
          THEME_ARCHIVE: ${{ inputs.theme_archive }}
          PLUGIN_ARCHIVE: ${{ inputs.plugin_archive }}
          PREVIOUS_PLUGIN_ARCHIVE: ${{ inputs.previous_plugin_archive }}
          PHP_VERSION: ${{ inputs.php_version }}
          EVIDENCE_ID: ${{ inputs.evidence_id }}
        run: |
          set -euo pipefail
          for archive in "$THEME_ARCHIVE" "$PLUGIN_ARCHIVE" "$PREVIOUS_PLUGIN_ARCHIVE"; do
            test -z "$archive" && continue
            [[ "$archive" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*[.]zip$ ]] || {
              echo "Invalid ZIP basename (no directories)" >&2; exit 2;
            }
            test -f "release-input/$archive"
          done
          [[ "$PHP_VERSION" =~ ^8[.][234]$ ]]
          [[ "$EVIDENCE_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,59}$ ]] || {
            echo 'Invalid evidence_id; use 1-60 safe characters' >&2; exit 2;
          }
          if [[ -n "$PREVIOUS_PLUGIN_ARCHIVE" ]]; then
            python3 harness/script/release-pair-prepare.py prepare \
              --theme "release-input/$THEME_ARCHIVE" --plugin "release-input/$PLUGIN_ARCHIVE" \
              --previous-plugin "release-input/$PREVIOUS_PLUGIN_ARCHIVE" \
              --output prepared --php "$PHP_VERSION"
          else
            python3 harness/script/release-pair-prepare.py prepare \
              --theme "release-input/$THEME_ARCHIVE" --plugin "release-input/$PLUGIN_ARCHIVE" \
              --output prepared --php "$PHP_VERSION"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install pinned official WordPress Docker environment
        run: npm install --global --ignore-scripts --no-audit --no-fund @wordpress/env@12.0.0
      - name: WordPress/MySQL activation, data preservation and upgrade
        shell: bash
        run: bash harness/script/release-pair-runtime.sh prepared
      - name: Official WordPress Plugin Check
        id: plugin_check
        if: inputs.plugin_check
        shell: bash
        run: |
          set -euo pipefail
          cd prepared
          slug="$(python3 -c 'import json;print(json.load(open("receipt.json"))["plugin_slug"])')"
          wp-env run cli wp plugin install plugin-check --version=2.1.0 --activate
          wp-env run cli wp plugin get plugin-check --field=version > evidence/plugin-check-version.txt
          upgrade_mode="$(python3 -c 'import json;print(json.load(open("receipt.json"))["upgrade_mode"])')"
          check_mode='new'
          if [[ "$upgrade_mode" == 'True' ]]; then check_mode='update'; fi
          printf '%s\n' "$check_mode" > evidence/plugin-check-mode.txt
          wp-env run cli wp plugin check "$slug" --mode="$check_mode" --format=strict-json > evidence/plugin-check.json
      - name: Optional isolated Lighthouse lab smoke
        id: lighthouse
        if: inputs.lighthouse_lab
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts --no-audit --no-fund @lhci/cli@0.15.1
          cd prepared
          lhci collect --url="http://127.0.0.1:$WP_ENV_PORT/" \
            --numberOfRuns=2 --settings.chromeFlags="--no-sandbox"
          mkdir -p evidence/lighthouse
          cp -a .lighthouseci/. evidence/lighthouse/
      - name: Record optional check outcomes even after earlier failures
        if: always()
        shell: bash
        env:
          PLUGIN_CHECK_ENABLED: ${{ inputs.plugin_check }}
          LIGHTHOUSE_LAB_ENABLED: ${{ inputs.lighthouse_lab }}
          PLUGIN_CHECK_OUTCOME: ${{ steps.plugin_check.outcome }}
          LIGHTHOUSE_OUTCOME: ${{ steps.lighthouse.outcome }}
        run: |
          set -euo pipefail
          mkdir -p prepared/evidence
          record_status() {
            local enabled="$1" outcome="$2" file="$3" status
            if [[ "$enabled" == "false" ]]; then
              status="NOT_RUN_DISABLED_BY_INPUT"
            elif [[ "$outcome" == "success" ]]; then
              status="PASSED"
            elif [[ "$outcome" == "failure" ]]; then
              status="FAILED"
            else
              status="NOT_RUN_UPSTREAM_FAILURE"
            fi
            printf '%s\n' "$status" > "$file"
          }
          record_status "$PLUGIN_CHECK_ENABLED" "$PLUGIN_CHECK_OUTCOME" prepared/evidence/plugin-check-status.txt
          record_status "$LIGHTHOUSE_LAB_ENABLED" "$LIGHTHOUSE_OUTCOME" prepared/evidence/lighthouse-status.txt
      - name: Save evidence to CALLER run (no ZIP/source upload)
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: wp-pair-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.evidence_id }}
          path: |
            prepared/receipt.json
            prepared/evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Destroy isolated WordPress Docker volumes
        if: always()
        shell: bash
        run: |
          if [[ -f prepared/.wp-env.json ]] && command -v wp-env >/dev/null 2>&1; then
            (cd prepared && wp-env destroy --force) || true
          fi
