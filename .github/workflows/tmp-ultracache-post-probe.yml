name: Temporary UltraCache POST probe patch

on:
  push:
    branches:
      - fix/ultracache-post-runtime-probe-20260817
    paths:
      - '.github/workflows/tmp-ultracache-post-probe.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: true
      - name: Patch POST-aware UltraCache state changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.audit/scripts/integration_runtime_probe.sh')
          text = path.read_text(encoding='utf-8')
          install_old = 'wp_set_current_user(1);UCP_Options::update('
          install_new = 'wp_set_current_user(1);$_SERVER["REQUEST_METHOD"]="POST";UCP_Options::update('
          remove_old = 'wp_set_current_user(1);$_REQUEST["_wpnonce"]='
          remove_new = 'wp_set_current_user(1);$_SERVER["REQUEST_METHOD"]="POST";$_REQUEST["_wpnonce"]='
          assert text.count(install_old) == 2, text.count(install_old)
          assert text.count(remove_old) == 2, text.count(remove_old)
          text = text.replace(install_old, install_new)
          text = text.replace(remove_old, remove_new)
          path.write_text(text, encoding='utf-8')
          PY
          bash -n .audit/scripts/integration_runtime_probe.sh
          python3 .audit/scripts/test_profile_routing.py
      - name: Commit validated harness patch
        shell: bash
        run: |
          git config user.name 'Webactueel Audit Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .audit/scripts/integration_runtime_probe.sh
          git diff --cached --exit-code && { echo 'No patch produced' >&2; exit 2; } || true
          git commit -m 'fix: simulate POST for UltraCache admin runtime probes'
          git push origin HEAD
