name: Phase 6 one-shot runner pin

on:
  push:
    branches:
      - chore/phase6-runtime-hardening-20260912
    paths:
      - .github/workflows/phase6-pin-runner.yml

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Pin reproducibility-sensitive audit runners and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/full-plugin-audit.yml')
          text = path.read_text(encoding='utf-8')
          count = text.count('runs-on: ubuntu-latest')
          if count < 1:
              raise SystemExit('No ubuntu-latest audit runner found to pin')
          text = text.replace('runs-on: ubuntu-latest', 'runs-on: ubuntu-24.04')
          path.write_text(text, encoding='utf-8')
          print(f'pinned {count} audit runner declaration(s)')
          PY
          ! grep -q 'runs-on: ubuntu-latest' .github/workflows/full-plugin-audit.yml
          git rm .github/workflows/phase6-pin-runner.yml
          git config user.name 'webactueel-phase6'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/full-plugin-audit.yml
          git commit -m 'Pin plugin audit runners to Ubuntu 24.04'
          git push origin HEAD
