name: Accountless Runtime Tools

on:
  pull_request:
    paths:
      - '.audit/scripts/playground_probe.sh'
      - '.audit/scripts/query_monitor_probe.sh'
      - '.github/workflows/accountless-runtime-tools.yml'
      - 'toolkit-contract.json'
  push:
    branches: [main]
    paths:
      - '.audit/scripts/playground_probe.sh'
      - '.audit/scripts/query_monitor_probe.sh'
      - '.github/workflows/accountless-runtime-tools.yml'
      - 'toolkit-contract.json'

permissions:
  contents: read

jobs:
  playground:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Run pinned Playground smoke probe
        shell: bash
        run: bash .audit/scripts/playground_probe.sh
      - name: Validate Query Monitor adapter is gated and pinned
        shell: bash
        run: |
          grep -F 'ALLOW_QUERY_MONITOR_DIAGNOSTICS' .audit/scripts/query_monitor_probe.sh
          grep -F 'query-monitor --version=4.0.7' .audit/scripts/query_monitor_probe.sh
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: programmeren-accountless-runtime-${{ github.run_id }}
          path: audit-results/playground/
          if-no-files-found: error
          retention-days: 7
