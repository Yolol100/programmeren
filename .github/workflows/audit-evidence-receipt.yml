name: Audit Evidence Receipt

on:
  workflow_run:
    workflows:
      - Full WordPress Plugin Audit
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  receipt:
    name: Build compact audit receipt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted audit harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Download source-run evidence artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p evidence
          gh run download "$RUN_ID" --repo "$REPOSITORY" --dir evidence || true

      - name: Build machine-readable receipt and evidence index
        shell: bash
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HARNESS_REPOSITORY: ${{ github.repository }}
          HARNESS_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 script/build-evidence-receipt.py \
            --evidence-dir evidence \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --run-conclusion "$RUN_CONCLUSION" \
            --harness-repo "$HARNESS_REPOSITORY" \
            --harness-sha "$HARNESS_SHA" \
            --output-dir receipt

      - name: Upload compact receipt artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-receipt-${{ github.event.workflow_run.id }}
          path: receipt/
          if-no-files-found: error
          retention-days: 14
