name: Full WordPress Plugin Audit

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target repository as owner/repository'
        required: true
        type: string
      target_ref:
        description: 'Branch, tag or commit to audit'
        required: true
        default: 'main'
        type: string
      target_path:
        description: 'Relative plugin path inside the target repository'
        required: true
        default: '.'
        type: string
      run_runtime:
        description: 'Run generic WordPress runtime and any matched plugin profile runtime'
        required: true
        default: true
        type: boolean
      php_version:
        description: 'PHP runtime for static tools'
        required: true
        default: '8.3'
        type: string
  push:
    branches:
      - main
    paths:
      - '.audit/request.json'

permissions:
  contents: read

concurrency:
  group: full-plugin-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Generic plugin audit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      request_id: ${{ steps.request.outputs.request_id }}
      target_repo: ${{ steps.request.outputs.target_repo }}
      target_ref: ${{ steps.request.outputs.target_ref }}
      target_path: ${{ steps.request.outputs.target_path }}
      plugin_dir: ${{ steps.request.outputs.plugin_dir }}
      run_runtime: ${{ steps.request.outputs.run_runtime }}
      php_version: ${{ steps.request.outputs.php_version }}
      profile_id: ${{ steps.profile.outputs.profile_id }}
      profile_version: ${{ steps.profile.outputs.profile_version }}
      profile_file: ${{ steps.profile.outputs.profile_file }}
      profile_match: ${{ steps.profile.outputs.profile_match }}
      profile_fingerprint: ${{ steps.profile.outputs.profile_fingerprint }}
      capabilities: ${{ steps.profile.outputs.capabilities }}
      specialized_runtime: ${{ steps.profile.outputs.specialized_runtime }}
      runtime_matrix: ${{ steps.profile.outputs.runtime_matrix }}

    steps:
      - name: Checkout audit harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate canonical audit harness contract
        shell: bash
        run: python3 .audit/scripts/validate_contract.py

      - name: Validate plugin-aware audit profiles
        shell: bash
        run: python3 .audit/scripts/validate_profiles.py

      - name: Run profile routing regression tests
        shell: bash
        run: python3 .audit/scripts/test_profile_routing.py

      - name: Resolve and validate audit request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          INPUT_TARGET_REPO: ${{ inputs.target_repo }}
          INPUT_TARGET_REF: ${{ inputs.target_ref }}
          INPUT_TARGET_PATH: ${{ inputs.target_path }}
          INPUT_RUN_RUNTIME: ${{ inputs.run_runtime }}
          INPUT_PHP_VERSION: ${{ inputs.php_version }}
          REQUEST_FILE: .audit/request.json
        run: python3 .audit/scripts/resolve_request.py >> "$GITHUB_OUTPUT"

      - name: Enforce public/private evidence boundary
        shell: bash
        env:
          TARGET_REPO: ${{ steps.request.outputs.target_repo }}
          HARNESS_VISIBILITY: ${{ github.event.repository.visibility }}
          GH_TOKEN: ${{ github.token }}
          PLUGIN_REPO_TOKEN: ${{ secrets.PLUGIN_REPO_TOKEN }}
        run: .audit/scripts/check_target_visibility.sh

      - name: Checkout target repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ steps.request.outputs.target_repo }}
          ref: ${{ steps.request.outputs.target_ref }}
          path: target-repo
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.PLUGIN_REPO_TOKEN || github.token }}

      - name: Resolve plugin-specific audit profile
        id: profile
        shell: bash
        env:
          TARGET_REPO: ${{ steps.request.outputs.target_repo }}
          PLUGIN_DIR: ${{ steps.request.outputs.plugin_dir }}
          RESULTS_DIR: audit-results
        run: python3 .audit/scripts/resolve_profile.py >> "$GITHUB_OUTPUT"

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ steps.request.outputs.php_version }}
          tools: composer:v2
          coverage: none
        env:
          fail-fast: true

      - name: Set up Node for generic WordPress runtime
        if: ${{ steps.request.outputs.run_runtime == 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install pinned audit tooling
        id: tools
        shell: bash
        run: |
          composer install --working-dir=.audit/tools --no-interaction --no-progress --prefer-dist --no-plugins --no-scripts
          expected_lock_sha='f5f0768d29b41a4c5833bd74031d1409268ee28efb42259bb5202668ae6f57c8'
          actual_lock_sha="$(sha256sum .audit/tools/composer.lock | awk '{print $1}')"
          if [[ "$actual_lock_sha" != "$expected_lock_sha" ]]; then
            echo "Audit dependency graph drift: expected $expected_lock_sha, got $actual_lock_sha" >&2
            exit 2
          fi
          .audit/tools/vendor/bin/phpcs --config-set installed_paths \
            "${GITHUB_WORKSPACE}/.audit/tools/vendor/wp-coding-standards/wpcs,${GITHUB_WORKSPACE}/.audit/tools/vendor/phpcsstandards/phpcsutils,${GITHUB_WORKSPACE}/.audit/tools/vendor/phpcsstandards/phpcsextra,${GITHUB_WORKSPACE}/.audit/tools/vendor/phpcompatibility/php-compatibility,${GITHUB_WORKSPACE}/.audit/tools/vendor/phpcompatibility/phpcompatibility-wp,${GITHUB_WORKSPACE}/.audit/tools/vendor/phpcompatibility/phpcompatibility-paragonie"
          .audit/scripts/install_cli_tools.sh
          mkdir -p audit-results
          cp .audit/tools/composer.lock audit-results/audit-tools-composer.lock

      - name: Record generic audit tool provenance
        shell: bash
        run: |
          {
            php -r 'echo "php=" . PHP_VERSION . PHP_EOL;'
            composer --version
            .audit/tools/vendor/bin/phpcs --version
            .audit/tools/vendor/bin/phpstan --version
            actionlint -version
            gitleaks version
            zizmor --version
          } > audit-results/tool-versions.txt

      - name: Static, compatibility, dependency and secret audit
        id: static
        continue-on-error: true
        shell: bash
        env:
          PLUGIN_DIR: ${{ steps.request.outputs.plugin_dir }}
          TARGET_REPO: ${{ steps.request.outputs.target_repo }}
          TARGET_REF: ${{ steps.request.outputs.target_ref }}
          GH_TOKEN: ${{ secrets.PLUGIN_REPO_TOKEN || github.token }}
        run: .audit/scripts/run_static_audit.sh

      - name: Trivy vulnerability and misconfiguration scan
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ steps.request.outputs.plugin_dir }}
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: json
          output: audit-results/trivy.json
          exit-code: '1'
          version: 'v0.74.0'
          cache: 'false'

      - name: WordPress Plugin Check controlled runtime
        id: plugincheck
        if: ${{ steps.request.outputs.run_runtime == 'true' }}
        continue-on-error: true
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1
        with:
          build-dir: ${{ steps.request.outputs.plugin_dir }}
          strict: 'false'

      - name: Generic wp-env runtime probe
        id: runtime
        if: ${{ always() && steps.request.outputs.run_runtime == 'true' && steps.tools.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: .audit/scripts/runtime_probe.sh

      - name: Write generic audit summary
        if: always()
        shell: bash
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          TARGET_REPO: ${{ steps.request.outputs.target_repo }}
          TARGET_REF: ${{ steps.request.outputs.target_ref }}
          TARGET_PATH: ${{ steps.request.outputs.target_path }}
          PROFILE_ID: ${{ steps.profile.outputs.profile_id }}
          PROFILE_MATCH: ${{ steps.profile.outputs.profile_match }}
          PROFILE_FINGERPRINT: ${{ steps.profile.outputs.profile_fingerprint }}
          CAPABILITIES: ${{ steps.profile.outputs.capabilities }}
          TOOLS_OUTCOME: ${{ steps.tools.outcome }}
          STATIC_OUTCOME: ${{ steps.static.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
          PLUGIN_CHECK_OUTCOME: ${{ steps.plugincheck.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          RUN_RUNTIME: ${{ steps.request.outputs.run_runtime }}
        run: |
          mkdir -p audit-results
          {
            echo "# WordPress Plugin Audit"
            echo
            echo "- request_id: \`$REQUEST_ID\`"
            echo "- repository: \`$TARGET_REPO\`"
            echo "- ref: \`$TARGET_REF\`"
            echo "- path: \`$TARGET_PATH\`"
            echo "- profile: \`${PROFILE_ID:-base}\`"
            echo "- profile_match: \`${PROFILE_MATCH:-default}\`"
            echo "- profile_fingerprint: \`${PROFILE_FINGERPRINT:-unknown}\`"
            echo "- capabilities: \`${CAPABILITIES:-none}\`"
            echo "- tooling: \`$TOOLS_OUTCOME\`"
            echo "- static: \`$STATIC_OUTCOME\`"
            echo "- trivy: \`$TRIVY_OUTCOME\`"
            echo "- plugin_check: \`${PLUGIN_CHECK_OUTCOME:-skipped}\`"
            echo "- generic_wp_env_runtime: \`${RUNTIME_OUTCOME:-skipped}\`"
            echo
            echo "Unknown or unmatched plugins use the base profile only. Product-specific services, WordPress plugins and probes are enabled only by a validated matched profile."
            echo "A scanner failure is a candidate finding, not automatically a confirmed bug."
          } | tee audit-results/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generic audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wordpress-plugin-audit-${{ github.run_id }}
          path: audit-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Generic quality gate
        if: always()
        shell: bash
        env:
          TOOLS_OUTCOME: ${{ steps.tools.outcome }}
          STATIC_OUTCOME: ${{ steps.static.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
          PLUGIN_CHECK_OUTCOME: ${{ steps.plugincheck.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          RUN_RUNTIME: ${{ steps.request.outputs.run_runtime }}
        run: |
          failures=0
          [[ "$TOOLS_OUTCOME" == "success" ]] || failures=$((failures + 1))
          [[ "$STATIC_OUTCOME" == "success" ]] || failures=$((failures + 1))
          [[ "$TRIVY_OUTCOME" == "success" ]] || failures=$((failures + 1))
          if [[ "$RUN_RUNTIME" == "true" ]]; then
            [[ "$PLUGIN_CHECK_OUTCOME" == "success" ]] || failures=$((failures + 1))
            [[ "$RUNTIME_OUTCOME" == "success" ]] || failures=$((failures + 1))
          fi
          if (( failures > 0 )); then
            echo "Generic audit gate failed in ${failures} evidence layer(s). Review the uploaded evidence."
            exit 1
          fi
          echo "Generic audit gate passed for the configured evidence layers."

  profile-runtime:
    name: Plugin-specific runtime (${{ matrix.profile_id }})
    needs: audit
    if: ${{ always() && needs.audit.result != 'cancelled' && needs.audit.outputs.run_runtime == 'true' && needs.audit.outputs.specialized_runtime == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.audit.outputs.runtime_matrix) }}
    services:
      mysql:
        image: ${{ matrix.mysql_image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: ${{ matrix.redis_image }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout audit harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Checkout target repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ needs.audit.outputs.target_repo }}
          ref: ${{ needs.audit.outputs.target_ref }}
          path: target-repo
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.PLUGIN_REPO_TOKEN || github.token }}

      - name: Re-resolve profile before specialized execution
        id: profile
        shell: bash
        env:
          TARGET_REPO: ${{ needs.audit.outputs.target_repo }}
          PLUGIN_DIR: ${{ needs.audit.outputs.plugin_dir }}
          RESULTS_DIR: audit-results
        run: python3 .audit/scripts/resolve_profile.py >> "$GITHUB_OUTPUT"

      - name: Verify profile fingerprint is unchanged
        shell: bash
        env:
          EXPECTED_PROFILE: ${{ needs.audit.outputs.profile_id }}
          ACTUAL_PROFILE: ${{ steps.profile.outputs.profile_id }}
          EXPECTED_FINGERPRINT: ${{ needs.audit.outputs.profile_fingerprint }}
          ACTUAL_FINGERPRINT: ${{ steps.profile.outputs.profile_fingerprint }}
        run: |
          [[ "$ACTUAL_PROFILE" == "$EXPECTED_PROFILE" ]] || { echo "Profile changed between jobs" >&2; exit 2; }
          [[ "$ACTUAL_FINGERPRINT" == "$EXPECTED_FINGERPRINT" ]] || { echo "Profile fingerprint changed between jobs" >&2; exit 2; }

      - name: Set up profile PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ needs.audit.outputs.php_version }}
          extensions: ${{ matrix.php_extensions }}
          ini-values: apc.enable_cli=1, display_errors=Off, log_errors=On
          tools: composer:v2, wp-cli:2.12.0
          coverage: none
        env:
          fail-fast: true

      - name: Set up profile Node runtime
        if: ${{ matrix.node_version != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node_version }}

      - name: Record profile runtime provenance
        shell: bash
        run: |
          mkdir -p audit-results
          {
            echo "profile=${{ matrix.profile_id }}"
            echo "profile_fingerprint=${{ needs.audit.outputs.profile_fingerprint }}"
            echo "capabilities=${{ needs.audit.outputs.capabilities }}"
            php -r 'echo "php=" . PHP_VERSION . PHP_EOL;'
            wp --version
            node --version 2>/dev/null || true
            npm --version 2>/dev/null || true
          } > audit-results/profile-tool-versions.txt

      - name: Run matched plugin profile runtime
        shell: bash
        env:
          PLUGIN_DIR: ${{ needs.audit.outputs.plugin_dir }}
          TARGET_REPO: ${{ needs.audit.outputs.target_repo }}
          TARGET_REF: ${{ needs.audit.outputs.target_ref }}
          TARGET_PATH: ${{ needs.audit.outputs.target_path }}
        run: bash "${{ matrix.runtime_script }}"

      - name: Write profile runtime summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Plugin-specific runtime"
            echo
            echo "- profile: \`${{ matrix.profile_id }}\`"
            echo "- matched_by: \`${{ needs.audit.outputs.profile_match }}\`"
            echo "- fingerprint: \`${{ needs.audit.outputs.profile_fingerprint }}\`"
            echo "- capabilities: \`${{ needs.audit.outputs.capabilities }}\`"
            echo
            echo "This job runs only because a validated plugin profile matched. An unmatched plugin never starts these services or probes."
          } | tee audit-results/PROFILE-SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plugin-specific runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wordpress-plugin-profile-${{ matrix.profile_id }}-${{ github.run_id }}
          path: audit-results/
          if-no-files-found: warn
          retention-days: 14
