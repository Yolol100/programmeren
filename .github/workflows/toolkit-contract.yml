name: Toolkit Contract

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'toolkit-contract.json'
      - '.audit/profiles/**'
      - '.audit/semgrep/**'
      - '.audit/scripts/**'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - '.github/*TEMPLATE.md'
      - 'script/**'
      - 'README.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Validate registered toolkit is accountless and wired
        run: |
          python3 - <<'PY'
          import json, pathlib
          c=json.load(open('toolkit-contract.json', encoding='utf-8'))
          for key in ('requires_account','requires_api_key','requires_mcp'):
              assert c.get(key) is False, f'{key} must be false'
          ids=[t['id'] for t in c['tools']]
          assert len(ids)==len(set(ids)), 'duplicate tool ids'
          covered=set()
          for a in c['usage_assertions']:
              assert a['tool'] in ids
              p=pathlib.Path(a['path']); assert p.is_file(), f'missing {p}'
              assert a['contains'] in p.read_text(encoding='utf-8'), f"{a['tool']} not wired in {p}"
              covered.add(a['tool'])
          assert covered==set(ids), f'unwired tools: {set(ids)-covered}'
          static=pathlib.Path('.audit/scripts/run_static_audit.sh').read_text(encoding='utf-8')
          assert 'semgrep mcp' not in static.lower()
          assert 'semgrep login' not in static.lower()
          assert '--metrics=off' in static
          print('toolkit-contract: OK')
          PY
      - name: Validate repository maintenance conventions
        shell: bash
        run: |
          bash -n script/validate
          bash -n script/audit
          bash -n script/package
          python3 - <<'PY'
          from pathlib import Path

          dependabot = Path('.github/dependabot.yml').read_text(encoding='utf-8')
          assert 'package-ecosystem: "github-actions"' in dependabot
          assert 'interval: "monthly"' in dependabot

          pr_template = Path('.github/PULL_REQUEST_TEMPLATE.md').read_text(encoding='utf-8')
          for heading in ('## Scope', '## Evidence', '## Tests', '## Risk and rollback', '## Open points'):
              assert heading in pr_template, f'missing PR template heading: {heading}'

          issue_template = Path('.github/ISSUE_TEMPLATE.md').read_text(encoding='utf-8')
          for heading in ('## Problem', '## Reproduction or evidence', '## Expected result', '## Verification'):
              assert heading in issue_template, f'missing issue template heading: {heading}'

          package = Path('script/package').read_text(encoding='utf-8')
          assert 'git archive' in package
          assert 'sha256sum' in package
          print('repository maintenance conventions: OK')
          PY
      - name: Validate audit profiles and profile routing
        shell: bash
        run: |
          python3 .audit/scripts/validate_profiles.py
          python3 .audit/scripts/test_profile_routing.py
          bash -n .audit/scripts/run_static_audit.sh
          python3 - <<'PY'
          import json, pathlib
          base=json.load(open('.audit/profiles/base.json', encoding='utf-8'))
          assert 'audit.phpunit-project' in base.get('capabilities', []), 'base profile must declare audit.phpunit-project'
          static=pathlib.Path('.audit/scripts/run_static_audit.sh').read_text(encoding='utf-8')
          assert 'has_profile_capability audit.phpunit-project' in static
          assert 'project-dependency-not-installed' in static
          assert 'profile-disabled' in static
          assert 'composer install' not in static, 'static audit must not install arbitrary target Composer dependencies'
          workflow=pathlib.Path('.github/workflows/full-plugin-audit.yml').read_text(encoding='utf-8')
          assert 'target_sha:' in workflow, 'full audit must expose the resolved immutable target SHA'
          assert 'needs.audit.outputs.target_sha' in workflow, 'specialized runtime must use the resolved target SHA'
          assert 'Capture immutable target commit' in workflow and 'Verify immutable target commit' in workflow
          assert 'commit=$TARGET_SHA' in static, 'static evidence inventory must bind to the resolved target commit'
          assert 'Trivy CycloneDX SBOM' in workflow, 'full audit must generate CycloneDX SBOM evidence'
          assert 'format: cyclonedx' in workflow, 'SBOM generation must use CycloneDX format'
          assert 'audit-results/sbom.cdx.sha256' in workflow, 'SBOM evidence must include a SHA-256 fingerprint'
          assert 'SBOM_VALIDATE_OUTCOME' in workflow, 'quality gate must include SBOM validation outcome'
          validator=pathlib.Path('.audit/scripts/validate_cyclonedx_sbom.py')
          assert validator.is_file(), 'CycloneDX validator must exist'
          print('profile-aware PHPUnit, target provenance and SBOM policy: OK')
          PY
      - name: Validate local Semgrep rules with pinned CE CLI
        shell: bash
        run: |
          python3 -m venv /tmp/semgrep-contract
          /tmp/semgrep-contract/bin/python -m pip install --disable-pip-version-check --no-input 'semgrep==1.170.0'
          SEMGREP_SEND_METRICS=off /tmp/semgrep-contract/bin/semgrep scan --validate --metrics=off --config .audit/semgrep/wordpress-security.yml
      - name: Generate fixture CycloneDX SBOM with pinned Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .audit/fixtures/programmeren-audit-fixture
          format: cyclonedx
          output: /tmp/programmeren-sbom.cdx.json
          exit-code: '0'
          version: 'v0.74.0'
          cache: 'false'
      - name: Validate and fingerprint fixture CycloneDX SBOM
        shell: bash
        run: |
          python3 .audit/scripts/validate_cyclonedx_sbom.py \
            /tmp/programmeren-sbom.cdx.json \
            --fingerprint /tmp/programmeren-sbom.cdx.sha256
          test -s /tmp/programmeren-sbom.cdx.json
          test -s /tmp/programmeren-sbom.cdx.sha256
