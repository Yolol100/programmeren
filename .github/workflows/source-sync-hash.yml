name: Source Sync Hash Oracle

on:
  push:
    branches:
      - main
    paths:
      - '.audit/source-sync/**'

permissions:
  contents: write

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Finalize staged manifest hashes
        shell: bash
        run: |
          manifest='.audit/source-sync/PROJECT-MANIFEST.json'
          perl -0pi -e 's/adf48017198fef225fe689d8e443420446e471603e06f26cf5d551058c839827/7f1f842ff71eb8eb553070563035a414b7c4bd2bcc37a01027782ba0ce18d1a6/g; s/490d21a80060fdca0fdeae4c1f17726f2f8091ab4beb55a5d6bbd89d1791a0b4/f4ab504077d433706fa460cea19fb4753277b869743bb8e4106c95053003200a/g; s/CRLF Drive-export bytes for 2026-08-15 canonical GitHub audit harness binding/CRLF Drive-export bytes (no terminal newline) for 2026-08-15 canonical GitHub audit harness binding/g' "$manifest"
          if ! git diff --quiet -- "$manifest"; then
            git config user.name 'Programmeren Source Sync'
            git config user.email 'actions@users.noreply.github.com'
            git add "$manifest"
            git commit -m 'Finalize Programmeren Drive source hashes'
            git push origin HEAD:main
          fi

      - name: Hash exact Drive representation
        shell: bash
        run: |
          drive_bytes() {
            perl -0pe 's/\n\z//; s/\n/\r\n/g' "$1"
          }

          echo 'Drive exact hashes and bytes (CRLF, no terminal newline):'
          while IFS= read -r -d '' file; do
            exact_hash="$(drive_bytes "$file" | sha256sum | awk '{print $1}')"
            exact_bytes="$(drive_bytes "$file" | wc -c | tr -d ' ')"
            printf '%s  %s  bytes=%s\n' "$exact_hash" "$file" "$exact_bytes"
          done < <(find .audit/source-sync -maxdepth 1 -type f -print0 | sort -z)

          manifest='.audit/source-sync/PROJECT-MANIFEST.json'
          manifest_exact_sha="$(drive_bytes "$manifest" | sha256sum | awk '{print $1}')"
          wrapper='/tmp/PROJECT-MANIFEST.json.md'
          {
            echo '# ChatGPT-compatibele kopie van `PROJECT-MANIFEST.json`'
            echo
            echo '- Canoniek bronpad: `PROJECT-MANIFEST.json`'
            echo '- Bronrol: Live projectmanifest'
            echo "- Canonieke SHA-256: \`$manifest_exact_sha\`"
            echo '- Conversie: uitsluitend verpakt als Markdown; de machine-inhoud hieronder is ongewijzigd.'
            echo
            echo '```json'
            cat "$manifest"
            echo '```'
          } > "$wrapper"
          echo 'Drive exact wrapper hash and bytes (CRLF, no terminal newline):'
          printf '%s  %s  bytes=%s\n' "$(drive_bytes "$wrapper" | sha256sum | awk '{print $1}')" "$wrapper" "$(drive_bytes "$wrapper" | wc -c | tr -d ' ')"
