name: Source Sync Hash Oracle

on:
  push:
    branches:
      - main
    paths:
      - '.audit/source-sync/**'

permissions:
  contents: read

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Hash source-sync files
        shell: bash
        run: |
          find .audit/source-sync -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum
